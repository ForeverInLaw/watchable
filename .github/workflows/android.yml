# Build and test the Android Companion on every PR that touches android/ or protocol/ (TZ §12.3);
# the core/protocol tests check the Notification event against protocol/schema.
# Runs on push to main too, so main seeds the Gradle cache that PRs read from.
name: android

on:
  pull_request:
    paths:
      - android/**
      - protocol/**
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - android/**
      - protocol/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running check; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      # Caches the wrapper, dependencies and the Gradle build cache (org.gradle.caching), so an
      # unchanged module is not recompiled or retested. PRs only read what main wrote.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The runner image ships an Android SDK without the minor platform compileSdk asks for
      # (android/app/build.gradle.kts); bump the version here together with it.
      - name: Locate Android SDK
        id: sdk
        run: echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Cache Android platform
        id: platform-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sdk.outputs.home }}/platforms/android-37.1
          key: android-platform-37.1

      - name: Install Android platform
        if: steps.platform-cache.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null

      # Robolectric downloads its Android runtime jar (about 150 MB) outside Gradle, into ~/.m2;
      # its version follows the Robolectric version in the catalog.
      - name: Cache Robolectric runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # One invocation configures the build once for both tasks.
      - name: Build and test
        run: ./gradlew :app:assembleDebug test

# Lint, typecheck and test the relay on every PR that touches relay/ (TZ §12.3).
# Runs on push to main too: GitHub only shares caches from the default branch with PRs,
# so main seeds the uv cache that every new PR starts from.
name: relay

on:
  pull_request:
    paths:
      - relay/**
      - .github/workflows/relay.yml
  push:
    branches: [main]
    paths:
      - relay/**
      - .github/workflows/relay.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running check; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04 # ships Python 3.12, see the setup-uv note
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    env:
      UV_LOCKED: "1" # fail instead of silently re-resolving when uv.lock is stale
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # relay/.python-version asks for 3.12, which the runner image already has, so no Python
      # is downloaded. The cache is keyed on uv.lock and pruned to wheels uv had to build:
      # pre-built wheels download faster than they restore.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          working-directory: relay
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

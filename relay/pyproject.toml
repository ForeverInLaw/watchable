[project]
name = "relay"
version = "0.1.0"
description = "Self-hosted relay between the Android companion and the watch app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioapns>=4.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "google-auth[requests]>=2.63.1",
    "httpx2>=2.16.2",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.16.3",
    # jsonschema checks the date-time format only when this is installed.
    "referencing>=0.37.0",
    "rfc3339-validator>=0.1.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
send-test-push = "relay.send_test_push:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# google-auth ships py.typed, but its service account constructors and errors carry no annotations.
untyped_calls_exclude = ["google.auth.exceptions", "google.oauth2.service_account"]

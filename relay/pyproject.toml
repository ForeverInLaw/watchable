[project]
name = "relay"
version = "0.1.0"
description = "Self-hosted relay between the Android companion and the watch app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioapns>=4.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
send-test-push = "relay.send_test_push:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    # jsonschema checks the date-time format only when this is installed.
    "rfc3339-validator>=0.1.4",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

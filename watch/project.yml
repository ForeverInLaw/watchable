# XcodeGen spec. The .xcodeproj is generated from this file and not committed:
#   cd watch && xcodegen generate
name: PersonalWatch

options:
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    # The only place the bundle id lives. Must match the App ID registered in
    # Apple Developer; the watch app id (APNs topic) is this plus ".watchkitapp".
    APP_BUNDLE_ID: io.github.foreverinlaw.personalwatch
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    # HTTPS only, which is exempt; spares the export compliance question on every TestFlight build.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # The relay and its pairing secret (TZ F1, §5.2). Only the CI TestFlight job sets them, from the
    # RELAY_URL variable and the PAIRING_SECRET secret; empty, the app shows the relay as not configured.
    RELAY_URL: ""
    PAIRING_SECRET: ""
  configs:
    # Release is only built by the CI TestFlight job (ADR 0004). It passes DEVELOPMENT_TEAM and
    # the profile UUIDs (IOS_PROFILE_UUID, WATCH_PROFILE_UUID) read from the installed profiles.
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Apple Distribution

targets:
  # Empty iOS wrapper Xcode requires to package and ship a watch-only app.
  PersonalWatch:
    type: application.watchapp2-container
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # iOS app validation requires these even though the wrapper never launches.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(IOS_PROFILE_UUID)
    dependencies:
      - target: PersonalWatch Watch App
    scheme: {}

  PersonalWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - PersonalWatch Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        # Merged with the generated Info.plist; carries RELAY_URL and PAIRING_SECRET into the bundle.
        INFOPLIST_FILE: PersonalWatch Watch App/Info.plist
        CODE_SIGN_ENTITLEMENTS: PersonalWatch Watch App/PersonalWatch.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: PersonalWatch
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(WATCH_PROFILE_UUID)
    scheme: {}
